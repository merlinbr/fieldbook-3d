<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stegosaurus model preview</title>
  <style>
    body { margin: 0; color: #293323; background: #e8e9df; font: 16px system-ui, sans-serif; }
    header { padding: 16px 24px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 8px 0; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; }
    button { font: inherit; padding: 8px 12px; cursor: pointer; }
    button[aria-pressed="true"] { font-weight: bold; outline: 2px solid #65734e; }
    #viewport { height: 70vh; min-height: 280px; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <header>
    <h1>Stegosaurus stenops — model preview</h1>
    <p id="status" role="status">Loading model…</p>
    <nav aria-label="Model views">
      <button data-view="threeQuarter">Three-quarter</button>
      <button data-view="side">Side</button>
      <button data-view="opposite">Opposite side</button>
      <button data-view="top">Top</button>
      <button id="walk" aria-pressed="false">Walk</button>
    </nav>
    <p>Drag to orbit · Scroll to zoom · Stylized reconstruction, not a calibrated scientific model.</p>
  </header>
  <main id="viewport" aria-label="Interactive Stegosaurus preview"></main>
  <script type="module" src="./main.js"></script>
</body>
</html>
