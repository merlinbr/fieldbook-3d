<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stegosaurus source / GLB comparison</title>
  <style>
    body { margin: 0; color: #293323; background: #e8e9df; font: 16px system-ui, sans-serif; }
    header { padding: 16px 24px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 8px 0; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; }
    button { font: inherit; padding: 8px 12px; cursor: pointer; }
    .labels { display: flex; text-align: center; font-weight: bold; }
    .labels span { width: 50%; }
    #viewport { height: 65vh; min-height: 280px; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <header>
    <h1>Stegosaurus — source / GLB comparison</h1>
    <p id="status" role="status">Loading the exported GLB from the separate media host…</p>
    <nav aria-label="Comparison views">
      <button data-view="threeQuarter">Three-quarter</button>
      <button data-view="side">Side</button>
      <button data-view="opposite">Opposite side</button>
    </nav>
    <p>Identical lighting, camera and resting pose. Drag to orbit · Scroll to zoom.</p>
    <p><a href="./">Return to source / walking preview</a></p>
  </header>
  <div class="labels"><span>Procedural source</span><span>Reloaded GLB</span></div>
  <main id="viewport" aria-label="Side-by-side procedural source and exported GLB"></main>
  <script type="module" src="./compare.js"></script>
</body>
</html>
